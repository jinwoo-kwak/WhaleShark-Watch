<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>고래상어 시계</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 실제 브라우저 화면에 맞춰 비율을 축소/확대할 래퍼 */
        .clock-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        /* 내부는 항상 1080x1920 픽셀로 고정하여 계산 오류 원천 차단 */
        .clock-container {
            position: relative;
            width: 1080px;
            height: 1920px;
            transform-origin: center center;
            /* JS에서 transform: scale()을 통해 크기 조정 */
        }

        .track {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }

        .dot {
            position: absolute;
            border-radius: 50%;
            background-color: #333;
            transition: background-color 0.1s, box-shadow 0.1s;
        }

        .dot.sec { width: 20px; height: 20px; margin: -10px 0 0 -10px; }
        .dot.min { width: 15px; height: 15px; margin: -7.5px 0 0 -7.5px; }
        .dot.hr  { width: 10px;  height: 10px;  margin: -5px 0 0 -5px; }

        .dot.sec.active { background-color: #64b5f6; box-shadow: 0 0 12px #64b5f6; }
        .dot.min.active { background-color: #81c784; box-shadow: 0 0 10px #81c784; }
        .dot.hr.active  { background-color: #ff8a80; box-shadow: 0 0 6px #ff8a80; }

        #hidden-svg-container {
            position: absolute;
            top: -9999px;
            left: -9999px;
            width: 500px;
            height: 500px;
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>
